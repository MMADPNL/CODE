<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CODE | Hot Voucher</title>

<style>
body{
    margin:0;
    background:#07111f;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif
}

.box{
    width:min(480px,92%);
    margin:35px auto;
    background:#0e1b2d;
    padding:22px;
    border-radius:18px;
    border:1px solid #24405f
}

h1{text-align:center}

label{
    display:block;
    margin-top:18px;
    margin-bottom:7px
}

input,select,button{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #294563;
    font-size:16px;
    box-sizing:border-box
}

input,select{
    background:#071321;
    color:white
}

button{
    margin-top:20px;
    background:#1683ff;
    color:white;
    border:0;
    font-weight:bold;
    cursor:pointer
}

button:disabled{
    opacity:.5
}

.info{
    background:#081727;
    padding:14px;
    border-radius:10px;
    margin-top:15px;
    line-height:2
}

.status{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    background:#081727
}

.result{
    display:none;
    margin-top:20px;
    padding:18px;
    border-radius:12px;
    background:#06131f;
    border:1px solid #2472a5
}

.code{
    direction:ltr;
    text-align:center;
    font-size:22px;
    letter-spacing:2px;
    padding:17px 5px;
    background:#020910;
    border-radius:10px;
    margin:15px 0;
    word-break:break-all
}

.used{
    background:#b52d3c
}

.history{
    margin-top:20px
}

.item{
    background:#081727;
    padding:12px;
    border-radius:10px;
    margin-top:8px;
    font-size:13px;
    line-height:1.9
}
</style>
</head>

<body>

<div class="box">

<h1>CODE</h1>

<div class="info">
    <div>نوع حساب: <b>مالک</b></div>
    <div>سهمیه روزانه: <b>۴۰۰ درخواست</b></div>
    <div>مصرف امروز: <b id="usedCount">۰</b></div>
</div>

<label>نوع ووچر</label>

<select id="voucherType">
    <option value="">انتخاب کنید</option>
    <option value="hot-voucher">Hot Voucher</option>
</select>

<label>مبلغ</label>

<input
    id="amount"
    type="number"
    min="1"
    placeholder="مثلاً 10"
>

<button id="requestButton" onclick="requestVoucher()">
    دریافت ووچر
</button>

<div id="status" class="status"></div>

<div id="result" class="result">

    <h3>ووچر دریافت شد</h3>

    <div id="voucherCode" class="code"></div>

    <button onclick="copyVoucher()">
        کپی کد
    </button>

    <button class="used" onclick="markUsed()">
        ثبت «مصرف‌شده»
    </button>

</div>

<div class="history">

<h3>سوابق</h3>

<div id="historyList"></div>

</div>

</div>

<script src="app.js"></script>

</body>
</html>
